name: Fork Linux Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        default: 'fix-codex-affinity-retry-and-version'
      version:
        description: 'Release version'
        required: false
        default: 'v0.13.2-ai.1'

permissions:
  contents: write

env:
  DEFAULT_VERSION: v0.13.2-ai.1

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || 'fix-codex-affinity-retry-and-version' }}
          fetch-depth: 0

      - name: Determine version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$DEFAULT_VERSION"
          fi
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build frontend (default)
        env:
          CI: ""
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build frontend (classic)
        env:
          CI: ""
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'

      - name: Build backend
        run: |
          go mod download
          BINARY="new-api-linux-amd64-$VERSION"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o "$BINARY"
          sha256sum "$BINARY" > checksums-linux-amd64.txt
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-linux-amd64-${{ env.VERSION }}
          path: |
            ${{ env.BINARY }}
            checksums-linux-amd64.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$BINARY" checksums-linux-amd64.txt --clobber
          else
            gh release create "$VERSION" "$BINARY" checksums-linux-amd64.txt \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "AI-assisted fork build for Codex/AI workflow fixes."
          fi
