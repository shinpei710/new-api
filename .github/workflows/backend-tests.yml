name: Backend Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'

      - name: Run targeted backend tests
        run: |
          go test ./setting/config ./service ./model -run 'TestUpdateConfigFromMap|TestShouldSkipRetryAfterChannelAffinityFailure|TestDefaultCodexChannelAffinityAllowsRetry|TestChannelAffinityHitCodexTemplatePassHeadersEffective|TestUpdateOptionPersistsAndUpdatesOptionMap'
